<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buzz In</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --navy-deep: #050a30;
    --navy: #0b1257;
    --gold: #ffd54a;
    --green: #23a35a;
    --green-dark: #17753e;
    --red: #e5484d;
    --red-dark: #b1373b;
    --ink: #eef1ff;
    --muted: #9aa3d1;
    --card: #111a4d;
    --card-border: #263275;
    --bg: radial-gradient(ellipse at top, #0c1868 0%, #050822 65%, #020313 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
  }
  .hidden { display: none !important; }
  h1 {
    font-family: 'Fredoka', sans-serif;
    color: var(--gold);
    font-size: 32px;
    margin: 0 0 24px;
    text-shadow: 0 2px 0 #7a5a00;
  }
  #loginView {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }
  #loginView input {
    background: var(--card);
    color: white;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
  }
  #loginView input:focus { outline: none; border-color: var(--gold); }
  #loginBtn {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(180deg, var(--green), var(--green-dark));
    color: white;
    border: none;
    padding: 14px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
  }
  #loginError { color: var(--red); font-size: 13px; min-height: 16px; }

  #playView {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #status {
    font-family: 'Fredoka', sans-serif;
    font-size: 18px;
    color: var(--muted);
    text-align: center;
  }
  #myScore {
    font-size: 14px;
    color: var(--muted);
  }
  #myScore b {
    font-family: 'Fredoka', sans-serif;
    color: var(--gold);
    font-size: 20px;
  }
  #clueMedia {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 100%;
  }
  #clueMedia img, #clueMedia video { max-width: 100%; max-height: 32vh; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
  #clueMedia audio { width: 100%; }
  #clueValue {
    font-family: 'Fredoka', sans-serif;
    color: var(--gold);
    font-size: 24px;
  }
  #answerReveal {
    text-align: center;
    color: var(--gold);
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    border-top: 1px solid var(--card-border);
    padding-top: 12px;
    width: 100%;
  }
  #answerMedia { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  #answerMedia img, #answerMedia video { max-width: 100%; max-height: 20vh; border-radius: 8px; }

  /* ---------- Read-only board (shown between clues) ---------- */
  #boardGridView {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #boardGridTitle {
    font-size: 24px;
    margin-bottom: 6px;
  }
  #boardStatusText {
    font-family: 'Fredoka', sans-serif;
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
  }
  .player-cat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .player-cat-name {
    font-family: 'Fredoka', sans-serif;
    color: var(--gold);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }
  .player-cat-values { display: flex; gap: 6px; flex-wrap: wrap; }
  .player-value-chip {
    background: var(--navy-deep);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
  }
  .player-value-chip.used { opacity: 0.3; text-decoration: line-through; }
  #buzzBtn {
    width: min(80vw, 320px);
    height: min(80vw, 320px);
    border-radius: 50%;
    border: none;
    font-family: 'Fredoka', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: white;
    background: radial-gradient(circle at 35% 30%, #ff6b6f, var(--red-dark));
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 -6px 12px rgba(0,0,0,0.25);
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  #buzzBtn:active:not(:disabled) { transform: scale(0.96); }
  #buzzBtn:disabled {
    background: linear-gradient(180deg, #2a3163, #1a1f42);
    color: #666f9e;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.4);
    cursor: default;
  }
  #buzzBtn.excluded {
    background: linear-gradient(180deg, #3a2130, #241018);
    color: #a86b7a;
  }
  #buzzResult {
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    color: var(--gold);
    min-height: 26px;
    text-align: center;
  }

  #wagerView {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  #wagerTitle {
    font-family: 'Fredoka', sans-serif;
    font-size: 30px;
    color: var(--gold);
    text-shadow: 0 2px 0 #7a5a00;
  }
  #wagerSub { color: var(--muted); font-size: 14px; }
  #wagerInput {
    width: 100%;
    background: var(--card);
    color: white;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 14px;
    font-size: 22px;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
  }
  #wagerInput:focus { outline: none; border-color: var(--gold); }
  #wagerSubmitBtn {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(180deg, var(--green), var(--green-dark));
    color: white;
    border: none;
    padding: 14px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
  }
  #wagerLockedText {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    color: var(--gold);
  }
</style>
</head>
<body>

<div id="loginView">
  <h1>🔔 Buzz In</h1>
  <input id="roomInput" placeholder="Room code" maxlength="8" style="text-transform:uppercase" />
  <input id="nameInput" placeholder="Your name" maxlength="24" />
  <input id="passwordInput" type="password" placeholder="Game password" />
  <button id="loginBtn">Join</button>
  <div id="loginError"></div>
</div>

<div id="myScore" class="hidden">Your score: <b id="myScoreValue">0</b></div>

<div id="boardGridView" class="hidden">
  <h1 id="boardGridTitle">Jeopardy</h1>
  <div id="boardStatusText">Waiting for the host to open a clue...</div>
  <div id="playerBoard"></div>
</div>

<div id="playView" class="hidden">
  <div id="clueValue"></div>
  <div id="clueMedia"></div>
  <div id="status">Waiting for the host to open a clue...</div>
  <button id="buzzBtn" disabled>BUZZ</button>
  <div id="buzzResult"></div>
  <div id="answerReveal" class="hidden">
    <div id="answerText"></div>
    <div id="answerMedia"></div>
  </div>
</div>

<div id="wagerView" class="hidden">
  <div id="wagerTitle">💰 DAILY DOUBLE!</div>
  <div id="wagerForm">
    <div id="wagerSub"></div>
    <input id="wagerInput" type="number" min="0" step="100" />
    <button id="wagerSubmitBtn">Lock In Wager</button>
  </div>
  <div id="wagerLockedText" class="hidden"></div>
</div>

<script>
let ws = null;
let excludedThisClue = false;
let lockedOut = false; // buzzing is locked (someone already won this clue attempt)

const loginView = document.getElementById('loginView');
const boardGridView = document.getElementById('boardGridView');
const playView = document.getElementById('playView');
const wagerView = document.getElementById('wagerView');
const statusEl = document.getElementById('status');
const boardStatusText = document.getElementById('boardStatusText');
const buzzBtn = document.getElementById('buzzBtn');
const buzzResult = document.getElementById('buzzResult');
const loginError = document.getElementById('loginError');
const wagerForm = document.getElementById('wagerForm');
const wagerInput = document.getElementById('wagerInput');
const wagerSub = document.getElementById('wagerSub');
const wagerSubmitBtn = document.getElementById('wagerSubmitBtn');
const wagerLockedText = document.getElementById('wagerLockedText');
let boardData = null; // { title, categories, usedClueIds } — the read-only board mirror

// Pre-fill the room code from a shared link like /play.html?room=BLUE2
const roomInput = document.getElementById('roomInput');
const presetRoom = new URLSearchParams(location.search).get('room');
if (presetRoom) roomInput.value = presetRoom.toUpperCase();

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

const PLAYER_SESSION_KEY = 'jeopardy_player_session';

async function login() {
  const roomCode = roomInput.value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!roomCode) { loginError.textContent = 'Enter the room code'; return; }
  if (!name) { loginError.textContent = 'Enter a name'; return; }
  loginError.textContent = '';

  try {
    const res = await fetch(`/api/rooms/${encodeURIComponent(roomCode)}/join`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password })
    });
    const result = await res.json();
    if (!res.ok) { loginError.textContent = result.error || 'Could not join'; return; }
    try { localStorage.setItem(PLAYER_SESSION_KEY, JSON.stringify({ token: result.token })); } catch (e) {}
    connect(result.token);
  } catch (err) {
    loginError.textContent = 'Could not reach server';
  }
}

// Resume an existing session (e.g. the page reloaded) instead of making the player
// re-type the room code/name/password every time — their score lives on the server
// either way, but this avoids the annoyance of logging back in.
function tryResumeSession() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(PLAYER_SESSION_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved || !saved.token) return;
  connect(saved.token, /* isResume */ true);
}

function connect(token, isResume) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  let opened = false;
  let roomClosedByHost = false;

  ws.addEventListener('open', () => {
    opened = true;
    try { localStorage.setItem(PLAYER_SESSION_KEY, JSON.stringify({ token })); } catch (e) {}
    loginView.classList.add('hidden');
    document.getElementById('myScore').classList.remove('hidden');
    showBoardGridView();
  });

  ws.addEventListener('message', (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'buzzer_idle') {
      lockedOut = false;
      excludedThisClue = false;
      buzzResult.textContent = '';
      showBoardGridView();
      setState('idle');
    } else if (msg.type === 'buzzer_open') {
      lockedOut = false;
      if (msg.excluded) excludedThisClue = true;
      buzzResult.textContent = '';
      showPlayView();
      setState(excludedThisClue ? 'excluded' : 'ready');
    } else if (msg.type === 'buzzer_locked') {
      lockedOut = true;
      showPlayView();
      setState('locked', msg.winnerName);
    } else if (msg.type === 'buzz_ack') {
      if (msg.status === 'winner') {
        buzzResult.textContent = "You're first! 🎉";
      } else if (msg.status === 'not_open') {
        buzzResult.textContent = 'Too late!';
      } else if (msg.status === 'excluded') {
        excludedThisClue = true;
        setState('excluded');
      }
    } else if (msg.type === 'dd_in_progress') {
      showBoardGridView(`Daily Double! Waiting on ${msg.playerName}...`);
    } else if (msg.type === 'wager_prompt') {
      showWagerView(msg.maxWager);
    } else if (msg.type === 'wager_locked') {
      wagerForm.classList.add('hidden');
      wagerLockedText.classList.remove('hidden');
      wagerLockedText.textContent = 'Wager locked in — good luck!';
    } else if (msg.type === 'your_score') {
      document.getElementById('myScoreValue').textContent = msg.score;
    } else if (msg.type === 'board_state') {
      boardData = msg;
      renderPlayerBoard();
    } else if (msg.type === 'clue_shown') {
      showClue(msg.value, msg.images);
    } else if (msg.type === 'answer_shown') {
      showAnswer(msg.answer, msg.answerImages);
    } else if (msg.type === 'room_closed') {
      roomClosedByHost = true;
      try { localStorage.removeItem(PLAYER_SESSION_KEY); } catch (e) {}
      wagerView.classList.add('hidden');
      showBoardGridView('The host closed this game.');
    }
  });

  ws.addEventListener('close', () => {
    if (roomClosedByHost) return; // that message already set the right status — don't stomp on it
    if (!opened && isResume) {
      // Saved session no longer valid (room gone/expired) — fall back to the login form.
      try { localStorage.removeItem(PLAYER_SESSION_KEY); } catch (e) {}
      return;
    }
    statusEl.textContent = 'Disconnected. Refresh to rejoin.';
    buzzBtn.disabled = true;
  });
}

function showPlayView() {
  boardGridView.classList.add('hidden');
  wagerView.classList.add('hidden');
  playView.classList.remove('hidden');
}

function showBoardGridView(statusText) {
  playView.classList.add('hidden');
  wagerView.classList.add('hidden');
  boardGridView.classList.remove('hidden');
  boardStatusText.textContent = statusText || 'Waiting for the host to open a clue...';
}

function showWagerView(maxWager) {
  playView.classList.add('hidden');
  boardGridView.classList.add('hidden');
  wagerView.classList.remove('hidden');
  wagerForm.classList.remove('hidden');
  wagerLockedText.classList.add('hidden');
  wagerSub.textContent = `Wager up to $${maxWager}`;
  wagerInput.max = maxWager;
  wagerInput.value = maxWager;
  wagerInput.focus();
}

// The read-only board mirror — categories + values only, updated as clues get used.
function renderPlayerBoard() {
  if (!boardData) return;
  document.getElementById('boardGridTitle').textContent = boardData.title || 'Jeopardy';
  const used = new Set(boardData.usedClueIds || []);
  const board = document.getElementById('playerBoard');
  board.innerHTML = '';
  boardData.categories.forEach((cat, ci) => {
    const catEl = document.createElement('div');
    catEl.className = 'player-cat';
    const values = cat.clues.map((clue, ri) => {
      if (!clue) return '';
      const isUsed = used.has(`${ci}-${ri}`);
      return `<span class="player-value-chip${isUsed ? ' used' : ''}">$${clue.value}</span>`;
    }).join('');
    catEl.innerHTML = `<div class="player-cat-name">${escapeHtml(cat.name)}</div><div class="player-cat-values">${values}</div>`;
    board.appendChild(catEl);
  });
}

function showClue(value, images) {
  showPlayView();
  document.getElementById('clueValue').textContent = '$' + value;
  renderPlayerMedia('clueMedia', images);
  document.getElementById('answerReveal').classList.add('hidden');
}

function showAnswer(answer, answerImages) {
  document.getElementById('answerText').textContent = answer;
  renderPlayerMedia('answerMedia', answerImages);
  document.getElementById('answerReveal').classList.remove('hidden');
}

function renderPlayerMedia(elId, media) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  (media || []).forEach(item => {
    let node;
    if (item.type === 'video') { node = document.createElement('video'); node.src = item.src; node.controls = true; }
    else if (item.type === 'audio') { node = document.createElement('audio'); node.src = item.src; node.controls = true; }
    else { node = document.createElement('img'); node.src = item.src; }
    el.appendChild(node);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

wagerSubmitBtn.addEventListener('click', () => {
  if (!ws) return;
  const amount = parseInt(wagerInput.value, 10) || 0;
  ws.send(JSON.stringify({ type: 'wager_submit', amount }));
});

function setState(state, winnerName) {
  buzzBtn.classList.remove('excluded');
  if (state === 'ready') {
    buzzBtn.disabled = false;
    statusEl.textContent = 'Buzz in!';
  } else if (state === 'excluded') {
    buzzBtn.disabled = true;
    buzzBtn.classList.add('excluded');
    statusEl.textContent = "You already tried this clue — wait for the next one.";
  } else if (state === 'locked') {
    buzzBtn.disabled = true;
    statusEl.textContent = winnerName ? `${winnerName} buzzed in first!` : 'Someone else buzzed in first.';
  } else {
    buzzBtn.disabled = true;
    statusEl.textContent = 'Waiting for the host to open a clue...';
  }
}

buzzBtn.addEventListener('click', () => {
  if (buzzBtn.disabled || !ws) return;
  ws.send(JSON.stringify({ type: 'buzz' }));
});

tryResumeSession();
</script>
</body>
</html>
